<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>LocatCam — Carte</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
	<style>
		html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
		#map { height: 100vh; width: 100vw; }
		.leaflet-popup-content-wrapper { font-family: sans-serif; }
		.leaflet-popup-content { margin: 8px; font-size: 13px; line-height: 1.4; }
		.leaflet-popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
	</style>
</head>
<body>
	<div id="map"></div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
	<script>
		var map = L.map('map', { zoomControl: true, touchZoom: true, scrollWheelZoom: false });

		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '&copy; OpenStreetMap contributors',
			maxZoom: 19
		}).addTo(map);

		var markersLayer = L.markerClusterGroup({
			spiderfyOnMaxZoom: false,
			showCoverageOnHover: false,
			zoomToBoundsOnClick: true,
			maxClusterRadius: 50
		});
		map.addLayer(markersLayer);

		window.clearMarkers = function () {
			markersLayer.clearLayers();
		};

		window.addMarkers = function (annoncesJson) {
			clearMarkers();
			try {
				var annonces = JSON.parse(annoncesJson || '[]');
			} catch (e) {
				var annonces = [];
			}
			annonces.forEach(function (a) {
				if (!a.latitude || !a.longitude) return;
				var marker = L.marker([a.latitude, a.longitude], { title: a.titre || '' });
				marker.annonceId = a.id;
				var popup = L.popup({ className: 'locatcam-popup' })
					.setContent('<strong>' + (a.titre || 'Annonce') + '</strong>' +
						'<div>' + (a.prix ? a.prix.toLocaleString('fr-CM') + ' FCFA' : '') + '</div>' +
						'<div>' + (a.quartier || '') + ', ' + (a.ville || '') + '</div>');
				marker.bindPopup(popup);
				marker.on('click', function () {
					window.onMarkerClick(a.id);
				});
				markersLayer.addLayer(marker);
			});
			if (annonces.length > 0) {
				var first = annonces[0];
				if (first.latitude && first.longitude) {
					map.setView([first.latitude, first.longitude], 13);
				}
			}
		};

		window.centerOn = function (lat, lng, zoom) {
			map.setView([lat, lng], zoom || 13);
		};

		window.onMarkerClick = function (id) {
			window.location.href = 'locatcam://marker?id=' + encodeURIComponent(id);
		};

		// Rechargement des annonces quand la zone visible change (debounce)
		var moveTimer = null;
		map.on('moveend', function () {
			if (moveTimer) clearTimeout(moveTimer);
			moveTimer = setTimeout(function () {
				var b = map.getBounds();
				var url = 'locatcam://bounds?'
					+ 'minLat=' + b.getSouth().toFixed(6)
					+ '&maxLat=' + b.getNorth().toFixed(6)
					+ '&minLng=' + b.getWest().toFixed(6)
					+ '&maxLng=' + b.getEast().toFixed(6);
				window.location.href = url;
			}, 600);
		});

		// Position initiale : Douala, Cameroun
		map.setView([4.0511, 9.7679], 13);
	</script>
</body>
</html>
